    <style>
        /* ==================== ESTILOS DO CHAT / ROBÔ FLUTUANTE ==================== */
        
        /* BOTÃO FLUTUANTE DO CHAT (Círculo verde idêntico à imagem) */
        .btn-abrir-chat-principal {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #5cb82a; /* Verde vivo da imagem */
            border: none;
            width: 70px;  
            height: 70px; 
            border-radius: 50%; /* Círculo perfeito */
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
            padding: 0;
        }

        .btn-abrir-chat-principal:hover {
            background-color: #4da31f;
            transform: scale(1.08); /* Zoom ao passar o mouse */
        }

        /* Ajuste de tamanho do vetor do robozinho */
        .btn-abrir-chat-principal svg {
            width: 58px;
            height: 58px;
        }

        /* CONTAINER FLUTUANTE DO IFRAME (JANELA DO CHAT) */
        .janela-chat-iframe {
            display: none;
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 10000;
            background: transparent !important; 
        }

        .janela-chat-iframe iframe {
            width: 400px;  
            height: 500px; 
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background-color: transparent !important; 
        }
    </style>
</head>

    <!-- ROBOZINHO IDÊNTICO À IMAGEM EM VETOR SVG -->
    <button class="btn-abrir-chat-principal" onclick="alternarJanelaIframe()" aria-label="Abrir Chatbot">
        <svg viewBox="0 0 512 512">
            <!-- Corpo e Pescoço -->
            <path d="M256 310v35h20v-35z" fill="#e1f5fe"/>
            <path d="M236 310v35h20v-35z" fill="#b3e5fc"/>
            <path d="M256 328c-71.8 0-130 58.2-130 130v54h130V328z" fill="#e1f5fe"/>
            <path d="M256 328v184h130v-54c0-71.8-58.2-130-130-130z" fill="#90caf9"/>
            <!-- Cabeça Externa -->
            <path d="M256 81c-82.3 0-142 55.4-142 110.5s59.7 110.5 142 110.5z" fill="#e1f5fe"/>
            <path d="M256 81v221c82.3 0 142-55.4 142-110.5S338.3 81 256 81z" fill="#b3e5fc"/>
            <!-- Visor Escuro -->
            <path d="M256 125c-54.1 0-98 29.5-98 66s43.9 66 98 66z" fill="#1a0066"/>
            <path d="M256 125v132c54.1 0 98-29.5 98-66s-43.9-66-98-66z" fill="#12004d"/>
            <!-- Olhos Verdes -->
            <path d="M210 143h16v40h-16z" fill="#5cb82a"/>
            <path d="M278 143h16v40h-16z" fill="#4da31f"/>
            <!-- Sorriso Verde -->
            <path d="M214 209c0 10.5 18.8 19 42 19v-19z" fill="#5cb82a"/>
            <path d="M256 209v19c23.2 0 42-8.5 42-19z" fill="#4da31f"/>

            <path d="M116 172c-15.5 0-28 11.2-28 25s12.5 25 28 25z" fill="#311b92"/>
            <path d="M116 172v50c6.6 0 12-11.2 12-25s-5.4-25-12-25z" fill="#90caf9"/>
            <path d="M396 172v50c15.5 0 28-11.2 28-25s-12.5-25-28-25z" fill="#1a0066"/>
            <path d="M396 172c-6.6 0-12 11.2-12 25s5.4 25 12 25z" fill="#64b5f6"/>
            <!-- Microfone do Headset -->
            <path d="M394 235c0 23.2-18.8 42-42 42h-40v-14h40c15.5 0 28-12.5 28-28z" fill="#1a0066"/>
            <path d="M312 263c-12.2 0-22 9.8-22 22s9.8 22 22 22 22-9.8 22-22-9.8-22-22-22z" fill="#1a0066"/>
        </svg>
    </button>

    <!-- Container oculto que carrega a janela do chat -->
    <div class="janela-chat-iframe" id="containerIframeChat">
        <iframe src="contato.html"></iframe>
    </div>

    <script>
        // Função para abrir e fechar a janela do chat ao clicar no robô
        function alternarJanelaIframe() {
            const container = document.getElementById('containerIframeChat');
            if (container.style.display === 'block') {
                container.style.display = 'none';
            } else {
                container.style.display = 'block';
            }
        }
    </script>
